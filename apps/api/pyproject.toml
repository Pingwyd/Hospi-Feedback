[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hospi-api"
version = "0.1.0"
description = "Hospi Feedback FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "PyJWT>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.20",
  "Pillow>=11.0.0",
  "filetype>=1.2.0",
  "fpdf2>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
