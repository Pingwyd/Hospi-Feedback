[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hospi-bot"
version = "0.1.0"
description = "Hospi Feedback Telegram bot"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "pydantic-settings>=2.6.0",
  "python-telegram-bot>=21.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]

[project.scripts]
hospi-bot = "bot.main:main"

[tool.setuptools.packages.find]
include = ["bot*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["bot", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
